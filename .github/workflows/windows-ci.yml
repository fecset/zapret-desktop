name: Windows CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ZapretDesktop.slnx
      - name: Build
        run: dotnet build ZapretDesktop.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test ZapretDesktop.slnx --configuration Release --no-build --logger trx --results-directory TestResults
      - name: Verify portable release package
        shell: pwsh
        run: ./scripts/Build-Release.ps1 -SkipTests
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
