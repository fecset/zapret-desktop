name: Release Windows portable

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-and-package:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - name: Validate release tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'A stable vMAJOR.MINOR.PATCH release tag is required.' }
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ZapretDesktop.slnx
      - name: Build
        run: dotnet build ZapretDesktop.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test ZapretDesktop.slnx --configuration Release --no-build
      - name: Build and verify release ZIP
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          ./scripts/Build-Release.ps1 -Version $env:RELEASE_TAG -SkipTests
          $zip = Get-Item -LiteralPath "dist/ZapretDesktop-$env:RELEASE_TAG-win-x64.zip"
          "sha256=$((Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Upload verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-windows-release
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify-and-package.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-windows-release
          path: package
      - name: Verify hash and publish GitHub release
        working-directory: package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify-and-package.outputs.tag }}
          PACKAGE_SHA256: ${{ needs.verify-and-package.outputs.sha256 }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$PACKAGE_SHA256" "ZapretDesktop-$RELEASE_TAG-win-x64.zip" | sha256sum --check --strict
          gh release create "$RELEASE_TAG" ./*.zip --verify-tag --title "Zapret Desktop $RELEASE_TAG" --notes-file "../docs/releases/$RELEASE_TAG.md"
